<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-label="SakshamGadade06 animated ASCII portrait">
  <defs>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ee787" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="whoClip">
      <rect x="28" y="57" width="0" height="22">
        <animate attributeName="width" begin="0.15s" dur="0.55s" values="0;86" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="nameClip">
      <rect x="80" y="91" width="0" height="19">
        <animate attributeName="width" begin="0.85s" dur="1.5s" values="0;130;175" keyTimes="0;0.72;1" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="roleClip">
      <rect x="80" y="115" width="0" height="19">
        <animate attributeName="width" begin="2.45s" dur="0.9s" values="0;145" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="focusClip">
      <rect x="90" y="139" width="0" height="19">
        <animate attributeName="width" begin="3.10s" dur="1.2s" values="0;200" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="760" height="500" rx="26" fill="#0d1117"/>

  <rect x="14" y="14" width="732" height="472" rx="18"
